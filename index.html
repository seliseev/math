<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Счёт в пределах 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Rubik:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241B4E;
    --mute:#6E679A;
    --grape:#6B4CE6;
    --lav:#F3F0FE;
    --edge:#E1DAF7;
    --sun:#FFC83D;
    --mint:#25C685;
    --coral:#FF5A5F;
    --paper:#FFFFFF;
    --line:rgba(107,76,230,.07);
    --lift:0 1px 2px rgba(36,27,78,.05), 0 6px 18px rgba(36,27,78,.06);
    --lift-lg:0 2px 4px rgba(36,27,78,.05), 0 14px 34px rgba(36,27,78,.08);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background-color:var(--lav);
    background-image:linear-gradient(var(--line) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:28px 28px;
    -webkit-tap-highlight-color:transparent;
  }

  .app{
    min-height:100%;
    max-width:960px;
    margin:0 auto;
    padding:20px 16px 32px;
    display:flex;
    flex-direction:column;
  }
  .screen{display:none;flex:1;flex-direction:column}
  .screen.is-on{display:flex}

  h1,.num,.chip,.btn,.key-num,.score,#count-out{font-family:"Rubik","Nunito",sans-serif}

  /* ---------- Стартовый экран ---------- */
  #screen-start{justify-content:center;align-items:center;text-align:center;padding-bottom:6vh}
  .eyebrow{
    font-weight:800;font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--grape);margin:0 0 10px;
  }
  h1{
    font-weight:900;font-size:clamp(34px,8.5vw,58px);line-height:1.05;margin:0 0 30px;
    letter-spacing:-.02em;
  }
  h1 .accent{color:var(--grape)}

  .btn{
    font-weight:800;font-size:17px;cursor:pointer;
    border:2px solid var(--edge);border-radius:16px;
    background:var(--paper);color:var(--ink);
    padding:13px 20px;box-shadow:var(--lift);
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease,border-color .12s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:var(--lift-lg)}
  .btn:active{transform:translateY(1px);box-shadow:none}
  .btn:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
  .btn-primary{
    background:var(--sun);border-color:transparent;
    font-size:clamp(20px,4.6vw,26px);padding:18px 44px;border-radius:20px;
    box-shadow:0 4px 14px rgba(255,200,61,.45);
  }
  .btn-primary:hover{box-shadow:0 8px 22px rgba(255,200,61,.5)}
  .btn-ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--mute);font-size:15px;padding:11px 16px}
  .btn-ghost:hover{background:var(--paper);box-shadow:var(--lift);transform:none}

  .setter{
    margin-top:26px;width:min(440px,100%);
    background:var(--paper);border:2px solid var(--edge);border-radius:20px;
    box-shadow:var(--lift);padding:18px 22px 14px;
  }
  .setter-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
  .setter-label{font-weight:800;font-size:14px;color:var(--mute)}
  #count-out{font-weight:900;font-size:30px;line-height:1}
  .ticks{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#A79FCB;margin-top:8px}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:10px;background:var(--lav);border-radius:99px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:var(--grape);border:3px solid var(--paper);box-shadow:0 2px 8px rgba(107,76,230,.4)}
  input[type=range]::-moz-range-track{height:10px;background:var(--lav);border-radius:99px}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--grape);border:3px solid var(--paper);box-shadow:0 2px 8px rgba(107,76,230,.4)}
  input[type=range]:focus-visible{outline:3px solid var(--grape);outline-offset:6px;border-radius:99px}

  /* ---------- Сессия ---------- */
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--paper);border:2px solid var(--edge);border-radius:99px;
    padding:7px 15px;font-weight:700;font-size:14px;color:var(--mute);
  }
  .chip b{font-size:18px;font-weight:900;color:var(--ink)}
  .chip.ok{background:#EAFAF3;border-color:#CDEEE0}
  .chip.bad{background:#FFF0F0;border-color:#FBD9DA}
  .chip .mark{font-size:16px;line-height:1}
  .chip.ok .mark{color:var(--mint)}
  .chip.bad .mark{color:var(--coral)}
  .spacer{flex:1}
  .icon-btn{width:40px;height:40px;padding:0;font-size:17px;border-radius:12px;display:grid;place-items:center;box-shadow:none;border-color:transparent;background:transparent;opacity:.6}
  .icon-btn:hover{opacity:1;background:var(--paper);box-shadow:var(--lift);transform:none}

  .ribbon{display:flex;gap:1px;height:8px;margin-bottom:20px}
  .ribbon i{flex:1;min-width:0;background:#E2DCF6;border-radius:2px}
  .ribbon i.ok{background:var(--mint)}
  .ribbon i.bad{background:var(--coral)}
  .ribbon i.now{background:var(--grape)}

  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}

  .card{
    background:var(--paper);border:2px solid var(--edge);border-radius:24px;
    box-shadow:var(--lift-lg);padding:28px 20px 22px;text-align:center;
  }
  .num{
    font-weight:900;font-size:clamp(48px,13vw,92px);line-height:1;letter-spacing:-.03em;
    display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,24px);
  }
  .op{color:var(--grape);font-weight:700}
  .slot{
    min-width:clamp(62px,16vw,116px);
    border:3px dashed var(--edge);border-radius:18px;
    padding:0 8px;color:#C3BAE6;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .slot.filled{border-style:solid;color:var(--paper)}
  .slot.right{background:var(--mint);border-color:var(--mint)}
  .slot.wrong{background:var(--coral);border-color:var(--coral)}
  .verdict{margin-top:14px;font-weight:800;font-size:clamp(15px,4vw,19px);min-height:1.6em;color:var(--mute)}
  .verdict.right{color:var(--mint)}
  .verdict.wrong{color:var(--coral)}

  .hint{text-align:center;font-weight:700;font-size:14px;color:var(--mute);margin:0}

  .pad{display:grid;grid-template-columns:repeat(11,1fr);gap:8px}
  .key{
    cursor:pointer;background:var(--paper);color:var(--ink);
    border:2px solid var(--edge);border-radius:14px;box-shadow:var(--lift);
    padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease,border-color .12s ease;
  }
  .key-num{font-weight:900;font-size:clamp(20px,4.4vw,27px);line-height:1}
  .pips{display:grid;grid-template-columns:repeat(5,5px);grid-auto-rows:5px;gap:3px;justify-content:center;min-height:13px}
  .pips i{width:5px;height:5px;border-radius:50%;background:#BDB0EE}
  .pips.zero i{background:transparent;border:1.5px solid #CFC6EF}
  .key:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--lift-lg);border-color:#C9BEF2}
  .key:active:not(:disabled){transform:translateY(1px);box-shadow:none}
  .key:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
  .key:disabled{cursor:default;opacity:.45}
  .key.pick-right{background:var(--mint);border-color:var(--mint);color:var(--paper);opacity:1}
  .key.pick-right .pips i{background:rgba(255,255,255,.85)}
  .key.pick-wrong{background:var(--coral);border-color:var(--coral);color:var(--paper);opacity:1}
  .key.pick-wrong .pips i{background:rgba(255,255,255,.85)}
  .key.reveal{background:#FFF3D2;border-color:var(--sun);opacity:1}

  .controls{display:flex;gap:8px;justify-content:center;margin-top:24px}

  /* ---------- Итоги ---------- */
  #screen-done{justify-content:center;align-items:center;text-align:center}
  .score{font-weight:900;font-size:clamp(60px,18vw,124px);line-height:.9;letter-spacing:-.04em}
  .score small{font-size:.34em;color:var(--grape)}
  .done-line{font-weight:800;font-size:18px;margin:12px 0 4px}
  .done-sub{font-weight:700;color:var(--mute);margin:0 0 24px}
  #screen-done .ribbon{width:min(440px,100%);margin-bottom:26px}

  @media (max-width:720px){
    .pad{grid-template-columns:repeat(6,1fr)}
    .app{padding:14px 12px 24px}
  }
  @media (max-width:400px){
    .pad{grid-template-columns:repeat(4,1fr);gap:7px}
    .chip{font-size:13px;padding:6px 12px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<main class="app">

  <!-- СТАРТ -->
  <section class="screen is-on" id="screen-start">
    <p class="eyebrow">Сложение и вычитание</p>
    <h1>Счёт в пределах <span class="accent">10</span></h1>

    <button class="btn btn-primary" id="btn-start">Старт сессии</button>

    <div class="setter">
      <div class="setter-top">
        <label class="setter-label" for="count">Примеров в сессии</label>
        <output id="count-out" for="count">100</output>
      </div>
      <input type="range" id="count" min="5" max="200" step="5" value="100">
      <div class="ticks"><span>5</span><span>200</span></div>
    </div>
  </section>

  <!-- СЕССИЯ -->
  <section class="screen" id="screen-play">
    <div class="bar">
      <span class="chip">Пример&nbsp;<b id="c-now">1</b>&nbsp;из&nbsp;<b id="c-total">100</b></span>
      <span class="chip ok"><span class="mark">✓</span><b id="c-right">0</b></span>
      <span class="chip bad"><span class="mark">✗</span><b id="c-wrong">0</b></span>
      <span class="spacer"></span>
      <button class="btn icon-btn" id="btn-sound" aria-pressed="true" title="Звук включён">🔊</button>
    </div>

    <div class="ribbon" id="ribbon" aria-hidden="true"></div>

    <div class="stage">
      <div class="card">
        <div class="num">
          <span id="a">7</span>
          <span class="op" id="op">+</span>
          <span id="b">2</span>
          <span class="op">=</span>
          <span class="slot" id="slot">?</span>
        </div>
        <div class="verdict" id="verdict" aria-live="polite"></div>
      </div>

      <p class="hint">Выбери ответ на клавиатуре внизу. Все ответы — от 0 до 10.</p>

      <div class="pad" id="pad"></div>
    </div>

    <div class="controls">
      <button class="btn btn-ghost" id="btn-restart">Перезапустить</button>
      <button class="btn btn-ghost" id="btn-exit">Выйти</button>
    </div>
  </section>

  <!-- ИТОГИ -->
  <section class="screen" id="screen-done">
    <p class="eyebrow">Сессия закончена</p>
    <div class="score"><span id="d-pct">0</span><small>%</small></div>
    <p class="done-line" id="d-line">Верно 0 из 0</p>
    <p class="done-sub" id="d-sub">С ошибкой: 0</p>
    <div class="ribbon" id="d-ribbon" aria-hidden="true"></div>
    <div class="controls">
      <button class="btn btn-primary" id="btn-again">Ещё раз</button>
      <button class="btn btn-ghost" id="btn-home">В начало</button>
    </div>
  </section>

</main>

<script>
(function(){
  "use strict";

  var el = function(id){ return document.getElementById(id); };
  var screens = { start: el('screen-start'), play: el('screen-play'), done: el('screen-done') };

  var state = { tasks: [], i: 0, right: 0, wrong: 0, locked: false, timer: null, sound: true };

  /* ---------- клавиатура ответов ---------- */
  var pad = el('pad');
  for (var n = 0; n <= 10; n++){
    var b = document.createElement('button');
    b.className = 'key';
    b.type = 'button';
    b.dataset.v = n;
    b.setAttribute('aria-label', 'Ответ ' + n);
    var pips = '<span class="pips' + (n === 0 ? ' zero' : '') + '">' +
               new Array((n === 0 ? 1 : n) + 1).join('<i></i>') + '</span>';
    b.innerHTML = '<span class="key-num">' + n + '</span>' + pips;
    pad.appendChild(b);
  }
  var keys = Array.prototype.slice.call(pad.children);

  /* ---------- звук ---------- */
  var ctx = null;
  function beep(freqs, type, dur){
    if (!state.sound) return;
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      freqs.forEach(function(f, k){
        var o = ctx.createOscillator(), g = ctx.createGain();
        var t0 = ctx.currentTime + k * dur;
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0 + dur + 0.02);
      });
    }catch(e){}
  }

  /* ---------- генерация примеров ---------- */
  function rnd(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }

  function makeTask(prev){
    for(;;){
      var plus = Math.random() < 0.5, a, b;
      if (plus){ a = rnd(0, 10); b = rnd(0, 10 - a); }
      else     { a = rnd(1, 10); b = rnd(0, a); }
      if (a === 0 && b === 0) continue;
      if (b === 0 && Math.random() < 0.75) continue;
      if (prev && prev.a === a && prev.b === b && prev.plus === plus) continue;
      return { a: a, b: b, plus: plus, ans: plus ? a + b : a - b };
    }
  }

  function buildTasks(count){
    var list = [], prev = null;
    for (var k = 0; k < count; k++){ prev = makeTask(prev); list.push(prev); }
    return list;
  }

  /* ---------- экраны ---------- */
  function show(name){
    for (var k in screens) screens[k].classList.toggle('is-on', k === name);
  }

  function drawRibbon(node){
    node.innerHTML = '';
    var frag = document.createDocumentFragment();
    for (var k = 0; k < state.tasks.length; k++) frag.appendChild(document.createElement('i'));
    node.appendChild(frag);
  }

  function startSession(count){
    clearTimeout(state.timer);
    state.tasks = buildTasks(count);
    state.i = 0; state.right = 0; state.wrong = 0; state.locked = false;
    el('c-total').textContent = count;
    drawRibbon(el('ribbon'));
    show('play');
    render();
  }

  function render(){
    var t = state.tasks[state.i];
    el('a').textContent = t.a;
    el('b').textContent = t.b;
    el('op').textContent = t.plus ? '+' : '−';

    var slot = el('slot');
    slot.textContent = '?';
    slot.className = 'slot';

    el('verdict').textContent = '';
    el('verdict').className = 'verdict';

    el('c-now').textContent = state.i + 1;
    el('c-right').textContent = state.right;
    el('c-wrong').textContent = state.wrong;

    keys.forEach(function(k){
      k.disabled = false;
      k.classList.remove('pick-right', 'pick-wrong', 'reveal');
    });

    var marks = el('ribbon').children;
    for (var k = 0; k < marks.length; k++) marks[k].classList.toggle('now', k === state.i);
    state.locked = false;
  }

  function answer(value){
    if (state.locked) return;
    var t = state.tasks[state.i];
    var ok = value === t.ans;
    state.locked = true;

    keys.forEach(function(k){ k.disabled = true; });
    keys[value].classList.add(ok ? 'pick-right' : 'pick-wrong');

    var slot = el('slot');
    slot.textContent = value;
    slot.classList.add('filled', ok ? 'right' : 'wrong');

    var v = el('verdict');
    var mark = el('ribbon').children[state.i];
    mark.classList.remove('now');

    if (ok){
      state.right++;
      v.textContent = 'Верно!';
      v.className = 'verdict right';
      mark.classList.add('ok');
      beep([660, 990], 'sine', 0.09);
    } else {
      state.wrong++;
      v.textContent = 'Правильный ответ: ' + t.ans;
      v.className = 'verdict wrong';
      mark.classList.add('bad');
      keys[t.ans].classList.add('reveal');
      beep([180], 'square', 0.22);
    }

    el('c-right').textContent = state.right;
    el('c-wrong').textContent = state.wrong;

    state.timer = setTimeout(next, ok ? 700 : 1700);
  }

  function next(){
    state.i++;
    if (state.i >= state.tasks.length) finish();
    else render();
  }

  function finish(){
    var total = state.tasks.length;
    el('d-pct').textContent = Math.round(state.right / total * 100);
    el('d-line').textContent = 'Верно ' + state.right + ' из ' + total;
    el('d-sub').textContent = 'С ошибкой: ' + state.wrong;

    var dr = el('d-ribbon');
    dr.innerHTML = el('ribbon').innerHTML;
    var marks = dr.children;
    for (var k = 0; k < marks.length; k++) marks[k].classList.remove('now');

    show('done');
  }

  /* ---------- события ---------- */
  var slider = el('count'), out = el('count-out');
  slider.addEventListener('input', function(){ out.textContent = slider.value; });

  el('btn-start').addEventListener('click', function(){ startSession(+slider.value); });
  el('btn-again').addEventListener('click', function(){ startSession(state.tasks.length); });
  el('btn-home').addEventListener('click', function(){ show('start'); });
  el('btn-restart').addEventListener('click', function(){ startSession(state.tasks.length); });
  el('btn-exit').addEventListener('click', function(){
    clearTimeout(state.timer);
    show('start');
  });

  el('btn-sound').addEventListener('click', function(){
    state.sound = !state.sound;
    this.textContent = state.sound ? '🔊' : '🔇';
    this.setAttribute('aria-pressed', String(state.sound));
    this.title = state.sound ? 'Звук включён' : 'Звук выключен';
  });

  pad.addEventListener('click', function(e){
    var k = e.target.closest('.key');
    if (k && !k.disabled) answer(+k.dataset.v);
  });

  // цифры с клавиатуры; «1» затем «0» в течение 500 мс = 10
  var buf = null, bufTimer = null;
  document.addEventListener('keydown', function(e){
    if (!screens.play.classList.contains('is-on')) return;
    if (e.key === 'Escape'){ clearTimeout(state.timer); show('start'); return; }
    if (!/^[0-9]$/.test(e.key)) return;
    var d = +e.key;
    if (buf === 1 && d === 0){ clearTimeout(bufTimer); buf = null; answer(10); return; }
    if (d === 1){
      buf = 1;
      clearTimeout(bufTimer);
      bufTimer = setTimeout(function(){ if (buf === 1){ buf = null; answer(1); } }, 500);
      return;
    }
    buf = null; clearTimeout(bufTimer);
    answer(d);
  });
})();
</script>
</body>
</html>
